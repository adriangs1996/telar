name: Verified C++ toolchain
description: Prepare the same pinned tools used by tools/cpp on a clean clone
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .toolchain
        key: cpp-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-cpp.py', 'tools/toolchain/**') }}
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python3 tools/bootstrap-cpp.py
        echo "$GITHUB_WORKSPACE/.toolchain/bin" >> "$GITHUB_PATH"
        echo "CC=$GITHUB_WORKSPACE/.toolchain/bin/clang" >> "$GITHUB_ENV"
        echo "CXX=$GITHUB_WORKSPACE/.toolchain/bin/clang++" >> "$GITHUB_ENV"
