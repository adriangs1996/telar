name: Verified C++ toolchain
description: Prepare the same pinned tools used by tools/cpp on a clean clone, and restore the native dependencies built with them
inputs:
  variant:
    description: The build variant (configuration, sanitizers) whose native dependency builds to restore and save
    required: false
    default: default
outputs:
  native-key:
    description: The key to save the native dependency builds under, with ./.github/actions/cpp-toolchain/save
    value: ${{ steps.native.outputs.cache-primary-key }}
  native-hit:
    description: Whether the native dependency builds were restored for this exact key
    value: ${{ steps.native.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The pinned LLVM is an official archive whose download takes no longer than restoring the 4.5 GiB
    # it unpacks to, so it is not cached: the repository's 10 GB cache budget goes to what has to be
    # built.
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python3 tools/bootstrap-cpp.py
        echo "$GITHUB_WORKSPACE/.toolchain/bin" >> "$GITHUB_PATH"
        echo "CC=$GITHUB_WORKSPACE/.toolchain/bin/clang" >> "$GITHUB_ENV"
        echo "CXX=$GITHUB_WORKSPACE/.toolchain/bin/clang++" >> "$GITHUB_ENV"

    # The managed native libraries and libghostty-vt, built from source: only their installations and
    # completion stamps, a few dozen MB, not their sources and build trees. Each one sits in a directory
    # keyed by everything that reaches its build, so an entry restored for other inputs is never used.
    # Only restored here: the workflow saves them with ./save once its configure step has built them,
    # so a later failing step does not throw them away, as actions/cache's post-job save would.
    - id: native
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .dependencies-cache/*/*/install
          .dependencies-cache/*/*/complete
          .dependencies-cache/ghostty/*/.complete
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ hashFiles('tools/toolchain/manifest.json', 'tools/bootstrap-cpp.py', 'tools/cpp', 'cmake/dependencies.cmake', 'cmake/managed_build.cmake', 'cmake/managed_toolchain.cmake', 'cmake/openssl.cmake', 'cmake/openssl/**', 'cmake/native/**', 'cmake/deps/**', 'src/runtime/tools/build_ghostty.py', 'src/runtime/vendor/**') }}
        restore-keys: |
          native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-
