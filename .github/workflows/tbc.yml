name: tbc

on:
  push:
    paths: ["lib/tbc/**", "lib/ebnf/**", "src/**/*.cppm", "tools/cpp", "tools/bootstrap-cpp.py", "tools/toolchain/**", "cmake/**", ".github/actions/cpp-toolchain/**", ".github/workflows/tbc.yml"]
  pull_request:
    paths: ["lib/tbc/**", "lib/ebnf/**", "src/**/*.cppm", "tools/cpp", "tools/bootstrap-cpp.py", "tools/toolchain/**", "cmake/**", ".github/actions/cpp-toolchain/**", ".github/workflows/tbc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        preset: [debug, sanitize]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lib/tbc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Linux development SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ make perl patch python3

      - uses: ./.github/actions/cpp-toolchain

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ${{ matrix.preset }} -DTBC_WARNINGS_AS_ERRORS=ON

      - name: Build and test
        run: |
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --target lifetime-check

      - name: Check formatting and generic diagnostics
        if: matrix.preset == 'debug'
        run: |
          cmake --build --preset debug --target format-check
          cmake --build --preset debug --target lint

      - name: Check EBNF module consumers
        working-directory: lib/ebnf
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      - name: Check dependency-free library package
        if: matrix.preset == 'debug'
        run: |
          cmake --preset library
          cmake --build --preset library
          cmake --install out/library --prefix "$RUNNER_TEMP/tbc-stage"
