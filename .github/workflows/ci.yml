name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.93.1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo packaging/release/install-linux-deps.sh

      - name: Install Zig
        run: |
          packaging/release/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      # `zig build test` runs the integration scripts with `node --test`,
      # which needs module.stripTypeScriptTypes: Node 22.13 or newer.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Build
        run: zig build

      - name: Check
        run: zig build check

      - name: Test
        run: zig build test

      # The server build is static musl: it must link nothing, and code that
      # imports a libc struct musl's headers cannot express fails here.
      - name: Headless build is static
        if: runner.os == 'Linux'
        run: |
          zig build -Dgui=false -Dtarget=x86_64-linux-musl --prefix zig-out/headless
          packaging/release/check-linkage.sh linux-headless zig-out/headless/bin/telar
          zig-out/headless/bin/telar --version

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh packaging/release/*.sh packaging/homebrew/*.sh packaging/macos/*.sh

      - name: Installer
        run: packaging/release/test-install.sh
