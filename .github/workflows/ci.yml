name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The layers of src/gui/ui (tools/ui-graph.py): no cycle, and no folder using one it may not.
  ui-layers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the UI rules
        run: |
          python3 -m unittest discover -s tools/tests -p test_ui_graph.py -v
          python3 tools/ui-graph.py HEAD --rules

  # The module graph of every process (tools/check-cpp-modules.py). It reads sources and
  # docs/build/modules.json and builds nothing, so it runs on every change, whichever tree it touches.
  cpp-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the module rules
        run: |
          python3 -m unittest discover -s tools/tests -p test_cpp_modules.py -v
          python3 tools/check-cpp-modules.py

      # Each case of tbc's spec names the file of src/ it comes from, which a rename or a deletion there
      # leaves behind. Loading the corpus checks that every one exists; it needs no build of tbc.
      - name: Check the provenance of tbc's spec
        run: python3 -c 'import sys; sys.path.insert(0, "lib/tbc/tests"); import spec_runner; spec_runner.load_cases()'
