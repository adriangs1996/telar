name: C++ runtime

on:
  workflow_dispatch:
  pull_request:
    paths: ['services/runtime-cpp/**', 'services/cli-cpp/**', 'dlls/**', 'cmake/**', 'tools/check-cpp-*.py', 'tools/tests/**', 'justfile', 'tools/cpp', 'tools/bootstrap-cpp.py', 'tools/toolchain/**', '.github/actions/cpp-toolchain/**', '.github/workflows/runtime-cpp.yml', 'packaging/release/**']
  push:
    branches: [main]
    paths: ['services/runtime-cpp/**', 'services/cli-cpp/**', 'dlls/**', 'cmake/**', 'tools/check-cpp-*.py', 'tools/tests/**', 'justfile', 'tools/cpp', 'tools/bootstrap-cpp.py', 'tools/toolchain/**', '.github/actions/cpp-toolchain/**', '.github/workflows/runtime-cpp.yml', 'packaging/release/**']

permissions:
  contents: read

concurrency:
  group: runtime-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            sanitizers: "OFF"
            distributable: "ON"
          - configuration: Debug
            sanitizers: "ON"
            distributable: "OFF"
    name: macOS ARM64 (${{ matrix.configuration }})
    defaults:
      run:
        working-directory: services/runtime-cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          test "$(uname -m)" = arm64

      - uses: ./.github/actions/cpp-toolchain

      - name: Validate public modules and editor
        working-directory: ${{ github.workspace }}
        run: |
          for project in auth websock; do
            tools/cpp configure "$project" -B ".dev/ci/$project" --config ${{ matrix.configuration }}
            tools/cpp build "$project" -B ".dev/ci/$project" -- --parallel 3
            tools/cpp test "$project" -B ".dev/ci/$project"
          done
          python3 tools/check-cpp-package.py --package websock --build .dev/ci/websock
          python3 tools/check-cpp-modules.py
          python3 -m unittest discover -s tools/tests -p test_cpp_bootstrap.py -v
          tools/cpp configure base -B .dev/ci/base --config ${{ matrix.configuration }}
          tools/cpp build base -B .dev/ci/base -- --parallel 3
          tools/cpp test base -B .dev/ci/base
          python3 tools/check-cpp-package.py --build .dev/ci/base
          python3 tools/check-cpp-editor.py --build .dev/ci/base --file dlls/telar-base/tests/base_test.cpp

      - name: Build libghostty-vt
        working-directory: ${{ github.workspace }}
        run: echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B out -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.toolchain/toolchain.cmake" \
            -DGHOSTTY_VT_ROOT="$GHOSTTY_VT_ROOT" \
            -DTELAR_RUNTIME_DISTRIBUTABLE=${{ matrix.distributable }} \
            -DTELAR_RUNTIME_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build and test
        run: |
          ulimit -n 8192
          cmake --build out --target telar-runtime telar runtime-tests tls-tests hook-tests event-loop-tests checkpoint-probe --parallel 3
          ctest --test-dir out --output-on-failure -R '^(runtime-tests|tls-tests|hook-tests|event-loop-tests|server-cli-tests)$'

      - name: Check distributable linkage
        if: matrix.distributable == 'ON'
        run: cmake --build out --target distributable-linkage --parallel 3

      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-cpp-${{ matrix.configuration }}
          path: |
            services/runtime-cpp/out/CMakeCache.txt
            services/runtime-cpp/out/Testing/Temporary/LastTest.log

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        configuration: [Release, Debug]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: Linux (${{ matrix.os }}, ${{ matrix.configuration }})
    defaults:
      run:
        working-directory: services/runtime-cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y make perl patch flex bison g++

      - uses: ./.github/actions/cpp-toolchain

      - name: Validate public modules and editor
        working-directory: ${{ github.workspace }}
        run: |
          for project in auth websock; do
            tools/cpp configure "$project" -B ".dev/ci/$project" --config ${{ matrix.configuration }}
            tools/cpp build "$project" -B ".dev/ci/$project" -- --parallel 3
            tools/cpp test "$project" -B ".dev/ci/$project"
          done
          python3 tools/check-cpp-package.py --package websock --build .dev/ci/websock
          python3 tools/check-cpp-modules.py
          python3 -m unittest discover -s tools/tests -p test_cpp_bootstrap.py -v
          tools/cpp configure base -B .dev/ci/base --config ${{ matrix.configuration }}
          tools/cpp build base -B .dev/ci/base -- --parallel 3
          tools/cpp test base -B .dev/ci/base
          python3 tools/check-cpp-package.py --build .dev/ci/base
          python3 tools/check-cpp-editor.py --build .dev/ci/base --file dlls/telar-base/tests/base_test.cpp

      - name: Build libghostty-vt
        working-directory: ${{ github.workspace }}
        run: echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.toolchain/toolchain.cmake" -DTELAR_CLIPBOARD_NATIVE=OFF \
            -DTELAR_RUNTIME_SANITIZERS=${{ matrix.configuration == 'Debug' && 'ON' || 'OFF' }} \
            -DGHOSTTY_VT_ROOT="$GHOSTTY_VT_ROOT"

      - name: Build and test
        run: |
          ulimit -n 8192
          cmake --build out --parallel 3 --target telar-runtime telar runtime-tests tls-tests \
            hook-tests event-loop-tests linux-platform-tests checkpoint-probe diagnostics-tests
          ctest --test-dir out --output-on-failure \
            -R '^(runtime-tests|tls-tests|hook-tests|event-loop-tests|linux-platform-tests|server-cli-tests|diagnostics-tests)$'
