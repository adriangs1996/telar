name: C++ runtime

on:
  workflow_dispatch:
  pull_request:
    paths: ['CMakeLists.txt', 'CMakePresets.json', 'src/CMakeLists.txt', 'src/runtime/**', 'src/cli/**', 'src/auth-daemon/**', 'lib/**', 'cmake/**', 'tools/check-cpp-*.py', 'tools/tests/**', 'justfile', 'tools/cpp', 'tools/bootstrap-cpp.py', 'tools/toolchain/**', '.github/actions/cpp-toolchain/**', '.github/workflows/runtime-cpp.yml', 'packaging/release/**', 'docs/build/interface-bodies-allowlist.txt', '.clang-tidy']
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'CMakePresets.json', 'src/CMakeLists.txt', 'src/runtime/**', 'src/cli/**', 'src/auth-daemon/**', 'lib/**', 'cmake/**', 'tools/check-cpp-*.py', 'tools/tests/**', 'justfile', 'tools/cpp', 'tools/bootstrap-cpp.py', 'tools/toolchain/**', '.github/actions/cpp-toolchain/**', '.github/workflows/runtime-cpp.yml', 'packaging/release/**', 'docs/build/interface-bodies-allowlist.txt', '.clang-tidy']

permissions:
  contents: read

concurrency:
  group: runtime-cpp-${{ github.ref }}
  # Only a pull request's runs give way to a newer push: a run on main finishes, so the caches it builds are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            sanitizers: "OFF"
            distributable: "ON"
          - configuration: Debug
            sanitizers: "ON"
            distributable: "OFF"
    name: macOS ARM64 (${{ matrix.configuration }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          test "$(uname -m)" = arm64

      - id: cpp
        uses: ./.github/actions/cpp-toolchain
        with:
          variant: ${{ matrix.configuration }}-sanitizers-${{ matrix.sanitizers }}

      - name: Build libghostty-vt
        run: echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      # The runtime, the CLI, the auth daemon and the libraries; gui-cpp.yml builds the GUI.
      - name: Configure
        run: |
          tools/cpp configure ci -- -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DTELAR_BUILD_GUI=OFF \
            -DTELAR_RUNTIME_DISTRIBUTABLE=${{ matrix.distributable }} \
            -DTELAR_SANITIZERS=${{ matrix.sanitizers }}

      - name: Save native dependency builds
        uses: ./.github/actions/cpp-toolchain/save
        with:
          key: ${{ steps.cpp.outputs.native-key }}
          hit: ${{ steps.cpp.outputs.native-hit }}

      - name: Validate public modules and editor
        run: |
          python3 tools/check-cpp-modules.py
          python3 -m unittest discover -s tools/tests -p 'test_cpp_*.py' -v
          tools/cpp build ci -- --target lib/all src/auth-daemon/all --parallel 3
          tools/cpp test ci -- -L '^lib\.'
          python3 tools/check-cpp-package.py --build out/ci
          python3 tools/check-cpp-editor.py --build out/ci --file lib/base/tests/base_test.cpp

      - name: Build and test
        run: |
          ulimit -n 8192
          tools/cpp build ci -- --target src/runtime/all src/cli/all checkpoint-probe --parallel 3
          # Every case of the runtime and CLI domains, and their integration tests; of the
          # end-to-end checks, the server's and those of the wire contract `api schema` prints.
          tools/cpp test ci -- -L '^(runtime|cli)\.' -LE '\.e2e$' --parallel 3
          tools/cpp test ci -- -R '^(server-cli-tests|exec-runtime-(offline|cli)-tests)$'

      - name: Check distributable linkage
        if: matrix.distributable == 'ON'
        run: tools/cpp build ci -- --target distributable-linkage --parallel 3

      # A cached tbc-lint is used as it is: its build tree would rebuild anyway, as the checkout gives every
      # source a new time. It is saved as soon as it is built, whatever the check then finds.
      - name: Restore tbc-lint
        id: tbc-lint
        if: matrix.configuration == 'Release'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/tbc/out/release/tbc-lint
          key: tbc-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/tbc/**', 'tools/toolchain/manifest.json', 'tools/bootstrap-cpp.py', 'tools/cpp') }}

      - name: Build tbc-lint
        if: matrix.configuration == 'Release' && steps.tbc-lint.outputs.cache-hit != 'true'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-lint --parallel 3

      - name: Save tbc-lint
        if: matrix.configuration == 'Release' && steps.tbc-lint.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/tbc/out/release/tbc-lint
          key: ${{ steps.tbc-lint.outputs.cache-primary-key }}

      # One pass of tbc-lint, which parses each unit once for the three checks.
      - name: Check lifetimes, interface bodies and blank lines
        if: matrix.configuration == 'Release'
        run: |
          tools/cpp exec -- cmake -DCHECK=lifetime+interface_bodies+blank_lines \
            -DBUILD_DIRECTORY=out/ci -DJOBS=3 -P cmake/scripts/check.cmake

      # clang-tidy over the units of this tree, in the configuration `just lint` checks, with tbc's
      # plugin, which keeps each unit from walking what it imports.
      - name: Lint
        if: matrix.configuration == 'Debug'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-tidy-scope
          tools/cpp exec -- cmake -DCHECK=lint -DBUILD_DIRECTORY=out/ci -DJOBS=3 -P cmake/scripts/check.cmake

      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-cpp-${{ matrix.configuration }}
          path: |
            out/ci/CMakeCache.txt
            out/ci/Testing/Temporary/LastTest.log

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        configuration: [Release, Debug]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: Linux (${{ matrix.os }}, ${{ matrix.configuration }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y make perl patch flex bison g++

      - id: cpp
        uses: ./.github/actions/cpp-toolchain
        with:
          variant: ${{ matrix.configuration }}

      - name: Build libghostty-vt
        run: echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          tools/cpp configure ci -- -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DTELAR_BUILD_GUI=OFF \
            -DTELAR_CLIPBOARD_NATIVE=OFF -DTELAR_SANITIZERS=${{ matrix.configuration == 'Debug' && 'ON' || 'OFF' }}

      - name: Save native dependency builds
        uses: ./.github/actions/cpp-toolchain/save
        with:
          key: ${{ steps.cpp.outputs.native-key }}
          hit: ${{ steps.cpp.outputs.native-hit }}

      - name: Validate public modules and editor
        run: |
          python3 tools/check-cpp-modules.py
          python3 -m unittest discover -s tools/tests -p 'test_cpp_*.py' -v
          tools/cpp build ci -- --target lib/all src/auth-daemon/all --parallel 3
          tools/cpp test ci -- -L '^lib\.'
          python3 tools/check-cpp-package.py --build out/ci
          python3 tools/check-cpp-editor.py --build out/ci --file lib/base/tests/base_test.cpp

      - name: Build and test
        run: |
          ulimit -n 8192
          tools/cpp build ci -- --target src/runtime/all src/cli/all checkpoint-probe --parallel 3
          # Every case of the runtime and CLI domains, and their integration tests; of the
          # end-to-end checks, the server's.
          tools/cpp test ci -- -L '^(runtime|cli)\.' -LE '\.e2e$' --parallel 3
          tools/cpp test ci -- -R '^server-cli-tests$'

      # tbc's plugin, which keeps each unit of the lint from walking what it imports. It fails the job
      # when it does not build, as the lint below does not.
      - name: Build the lint plugin
        if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-tidy-scope

      # clang-tidy over the units Linux builds, which the macOS job does not see. They have not been
      # through the lint yet, so the step reports what it finds without failing the job.
      - name: Lint
        if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Debug'
        continue-on-error: true
        run: tools/cpp exec -- cmake -DCHECK=lint -DBUILD_DIRECTORY=out/ci -DJOBS=3 -P cmake/scripts/check.cmake
