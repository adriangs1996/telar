name: C++ GUI managed Qt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gui-cpp.yml'
      - 'src/gui-cpp/**'
      - 'packaging/release/install-linux-deps.sh'
      - 'lib/telar-*/**'
      - 'lib/tbc/**'
      - 'cmake/**'
      - 'justfile'
      - 'tools/check-cpp-*.py'
      - 'tools/tests/**'
      - 'tools/cpp'
      - 'tools/bootstrap-cpp.py'
      - 'tools/toolchain/**'
      - '.github/actions/cpp-toolchain/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gui-cpp.yml'
      - 'src/gui-cpp/**'
      - 'packaging/release/install-linux-deps.sh'
      - 'lib/telar-*/**'
      - 'lib/tbc/**'
      - 'cmake/**'
      - 'justfile'
      - 'tools/check-cpp-*.py'
      - 'tools/tests/**'
      - 'tools/cpp'
      - 'tools/bootstrap-cpp.py'
      - 'tools/toolchain/**'
      - '.github/actions/cpp-toolchain/**'

permissions:
  contents: read

concurrency:
  group: gui-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop SDK
        if: runner.os == 'Linux'
        run: sudo packaging/release/install-linux-deps.sh

      - uses: ./.github/actions/cpp-toolchain

      - name: Identify the Qt build toolchain
        id: toolchain
        shell: bash
        run: |
          { "$CXX" --version; cmake --version; uname -m; if [[ "$RUNNER_OS" == macOS ]]; then xcrun --show-sdk-path; fi; } > "$RUNNER_TEMP/qt-toolchain"
          echo "key=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$RUNNER_TEMP/qt-toolchain")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qt-cache
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/toolchain/manifest.json', 'tools/bootstrap-cpp.py', 'cmake/managed_toolchain.cmake', 'src/gui-cpp/cmake/qt.cmake', 'src/gui-cpp/cmake/qt/**') }}

      - name: Test dependency integrity and package isolation
        run: python3 -m unittest discover -s src/gui-cpp/tools -p test_qt_dependency.py -v

      - name: Install Zig and build libghostty-vt
        run: |
          echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      - name: Configure with managed Qt
        run: |
          cmake -S src/gui-cpp -B src/gui-cpp/out -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.toolchain/toolchain.cmake" \
            -DGHOSTTY_VT_ROOT="$GHOSTTY_VT_ROOT" -DTELAR_GUI_QT_JOBS=3

      - name: Build GUI and focused regression tests
        run: |
          cmake --build src/gui-cpp/out --parallel 3 \
            --target telar-gui gui-status-bar-test gui-native-pointer-events-test
          ctest --test-dir src/gui-cpp/out --output-on-failure -R '^gui-(qt-dependency|status-bar|native-pointer-events)$'

      - name: Test native macOS navigation
        if: runner.os == 'macOS'
        run: |
          cmake --build src/gui-cpp/out --parallel 3 --target gui-native-window-appearance-test
          QT_QUICK_BACKEND=software ctest --test-dir src/gui-cpp/out --output-on-failure -R '^gui-native-window-appearance$'

      - name: Check lifetimes
        if: matrix.configuration == 'Release'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-lint --parallel 3
          cmake --build src/gui-cpp/out --target gui-lifetime
