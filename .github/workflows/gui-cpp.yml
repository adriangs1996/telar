name: C++ GUI managed Qt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gui-cpp.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/CMakeLists.txt'
      - 'src/gui/**'
      - 'packaging/release/install-linux-deps.sh'
      - 'lib/**'
      - 'docs/build/interface-bodies-allowlist.txt'
      - '.clang-tidy'
      - 'cmake/**'
      - 'justfile'
      - 'tools/check-cpp-*.py'
      - 'tools/tests/**'
      - 'tools/cpp'
      - 'tools/bootstrap-cpp.py'
      - 'tools/toolchain/**'
      - '.github/actions/cpp-toolchain/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gui-cpp.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/CMakeLists.txt'
      - 'src/gui/**'
      - 'packaging/release/install-linux-deps.sh'
      - 'lib/**'
      - 'docs/build/interface-bodies-allowlist.txt'
      - '.clang-tidy'
      - 'cmake/**'
      - 'justfile'
      - 'tools/check-cpp-*.py'
      - 'tools/tests/**'
      - 'tools/cpp'
      - 'tools/bootstrap-cpp.py'
      - 'tools/toolchain/**'
      - '.github/actions/cpp-toolchain/**'

permissions:
  contents: read

concurrency:
  group: gui-cpp-${{ github.ref }}
  # Only a pull request's runs give way to a newer push: a run on main finishes, so the caches it builds are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  managed-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop SDK
        if: runner.os == 'Linux'
        run: sudo packaging/release/install-linux-deps.sh

      - id: cpp
        uses: ./.github/actions/cpp-toolchain
        with:
          variant: ${{ matrix.configuration }}

      - name: Identify the Qt build toolchain
        id: toolchain
        shell: bash
        run: |
          { "$CXX" --version; cmake --version; uname -m; if [[ "$RUNNER_OS" == macOS ]]; then xcrun --show-sdk-path; fi; } > "$RUNNER_TEMP/qt-toolchain"
          echo "key=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$RUNNER_TEMP/qt-toolchain")" >> "$GITHUB_OUTPUT"

      # Qt's installation and completion stamp, about 200 MB, not its 2-4 GB build tree: restored here
      # and saved once the configure step has built it, whatever the later steps find.
      - id: qt
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .qt-cache/*/install
            .qt-cache/*/complete
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/toolchain/manifest.json', 'tools/bootstrap-cpp.py', 'cmake/TelarToolchain.cmake', 'cmake/managed_toolchain.cmake', 'src/gui/cmake/qt.cmake', 'src/gui/cmake/qt/**') }}

      - name: Test dependency integrity and package isolation
        run: python3 -m unittest discover -s src/gui/tools -p test_qt_dependency.py -v

      - name: Install Zig and build libghostty-vt
        run: |
          echo "GHOSTTY_VT_ROOT=$(tools/cpp vt | tail -n 1)" >> "$GITHUB_ENV"

      # The GUI and the libraries; runtime-cpp.yml builds the other processes.
      - name: Configure with managed Qt
        run: |
          tools/cpp configure ci -- -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DTELAR_BUILD_RUNTIME=OFF -DTELAR_BUILD_CLI=OFF -DTELAR_BUILD_AUTH=OFF -DTELAR_GUI_QT_JOBS=3

      - name: Save native dependency builds
        uses: ./.github/actions/cpp-toolchain/save
        with:
          key: ${{ steps.cpp.outputs.native-key }}
          hit: ${{ steps.cpp.outputs.native-hit }}

      - name: Save Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .qt-cache/*/install
            .qt-cache/*/complete
          key: ${{ steps.qt.outputs.cache-primary-key }}

      - name: Build GUI and focused regression tests
        run: |
          tools/cpp build ci -- --parallel 3 \
            --target telar-gui gui-status-bar-test gui-ui-kit-tests
          tools/cpp test ci -- -R '^(gui-(qt-dependency|status-bar)$|gui\.ui\.kit\.native_pointer_events\.)'

      # The domains below ui: the value types, the features and the application. Their tests open
      # no window, and the session's are where the negotiation with an older runtime is checked.
      - name: Test the domains below the UI
        run: |
          tools/cpp build ci -- --parallel 3 \
            --target src/gui/foundation/all src/gui/features/all src/gui/application/all
          tools/cpp test ci -- -R '^gui\.(foundation|features|application)\.' --parallel 3

      - name: Test native macOS navigation
        if: runner.os == 'macOS'
        run: |
          tools/cpp build ci -- --parallel 3 --target gui-platform-tests
          QT_QUICK_BACKEND=software tools/cpp test ci -- -R '^gui\.platform\.native_window_appearance\.'

      # A cached tbc-lint is used as it is: its build tree would rebuild anyway, as the checkout gives every
      # source a new time. It is saved as soon as it is built, whatever the check then finds.
      - name: Restore tbc-lint
        id: tbc-lint
        if: matrix.configuration == 'Release'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/tbc/out/release/tbc-lint
          key: tbc-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/tbc/**', 'tools/toolchain/manifest.json', 'tools/bootstrap-cpp.py', 'tools/cpp') }}

      - name: Build tbc-lint
        if: matrix.configuration == 'Release' && steps.tbc-lint.outputs.cache-hit != 'true'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-lint --parallel 3

      - name: Save tbc-lint
        if: matrix.configuration == 'Release' && steps.tbc-lint.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/tbc/out/release/tbc-lint
          key: ${{ steps.tbc-lint.outputs.cache-primary-key }}

      # One pass of tbc-lint, which parses each unit once for its checks. Only the macOS units have
      # had the blank lines of docs/code-style.md applied.
      - name: Check lifetimes, interface bodies and blank lines
        if: matrix.configuration == 'Release'
        run: |
          tools/cpp exec -- cmake -DCHECK=lifetime+interface_bodies${{ runner.os == 'macOS' && '+blank_lines' || '' }} \
            -DBUILD_DIRECTORY=out/ci -DJOBS=3 -P cmake/scripts/check.cmake

      # tbc's plugin, which keeps each unit of the lint from walking what it imports. It fails the job
      # on every system when it does not build, as the lint below does not on Linux.
      - name: Build the lint plugin
        if: matrix.configuration == 'Debug'
        run: |
          tools/cpp configure tbc -B lib/tbc/out/release --config Release -- -DBUILD_TESTING=OFF
          tools/cpp build tbc -B lib/tbc/out/release -- --target tbc-tidy-scope

      # clang-tidy over the units of this tree, in the configuration `just lint` checks. The units only
      # Linux builds have not been through the lint yet, so there the step reports what it finds without
      # failing the job.
      - name: Lint
        if: matrix.configuration == 'Debug'
        continue-on-error: ${{ runner.os == 'Linux' }}
        run: tools/cpp exec -- cmake -DCHECK=lint -DBUILD_DIRECTORY=out/ci -DJOBS=3 -P cmake/scripts/check.cmake
