<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1870" viewBox="0 0 2000 1870" role="img" aria-labelledby="title description" lang="es">
  <title id="title">telar: productores concurrentes, estado serializado e IPC full-duplex</title>
  <desc id="description">Modelo de ejecución propuesto. En el cliente, input, temporizadores y recepción IPC publican mensajes en una inbox. ClientLoop es el único consumidor y dueño del modelo. Los handlers admiten comandos en una outbox; un consumidor independiente los escribe por IPC. El runtime recibe comandos y publica respuestas o cambios espontáneos mediante delivery por cliente y otro escritor independiente. La recepción del cliente vuelve a publicar en su inbox. El render lee el modelo en ClientLoop y cede bytes estables a un escritor del terminal. El mecanismo de mensajes y efectos se inspira en Native SDK; la separación en procesos, las outboxes IPC y la persistencia del runtime son decisiones de telar. Se incluye un detalle de presentación y referencias al commit estudiado de Native.</desc>
  <defs>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #e8eef8; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -1px; }
