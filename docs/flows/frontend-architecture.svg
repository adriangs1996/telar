<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title description">
  <title id="title">Telar: entradas concretas por proceso</title>
  <desc id="description">GUI y TUI son alternativas de host. Cada conexión conserva su propio AttachedClient y llama directamente a operaciones comunes. Runtime.update despacha eventos y requests.dispatch selecciona las operaciones que poseen PTYs, VT e historia. Modelo, presentación y recursos mantienen sus límites de vida y presupuestos.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #172b3a; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 20px; fill: #4d6474; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #4d6474; }
      .code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 17px; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #356874; }
      .panel { fill: #fff; stroke: #cedae2; stroke-width: 1.5; }
      .host { fill: #fff7e9; stroke: #dfc494; stroke-width: 1.5; }
      .common { fill: #eaf4f7; stroke: #9ebfcb; stroke-width: 1.5; }
      .runtime { fill: #f0f1fb; stroke: #adb4d6; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #526f80; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526f80"/></marker>
  </defs>
  <rect width="1800" height="1160" fill="#f4f7f9"/>
  <text x="45" y="66" class="title">Telar: empieza por el evento, sigue la operación</text>
  <text x="45" y="103" class="subtitle">GUI y TUI usan la misma biblioteca. Cada conexión tiene estado propio; el runtime conserva lo duradero.</text>

  <rect x="45" y="145" width="540" height="255" rx="14" class="host"/>
  <text x="68" y="177" class="label">CLIENTE · HOST NATIVO</text>
  <text x="68" y="213" class="heading">GUI</text>
  <text x="68" y="247" class="code">GuiClient.start → update → dispatch</text>
  <text x="68" y="277" class="body">acceptInput → inputReady → NativeInput.drain</text>
  <text x="68" y="307" class="body">prepare → GPU → complete</text>
  <text x="68" y="341" class="small">NativeLoop: transporte, wakeup y vida de tareas.</text>
  <text x="68" y="373" class="code">src/gui/GuiClient.zig</text>

  <rect x="625" y="145" width="540" height="255" rx="14" class="host"/>
  <text x="648" y="177" class="label">CLIENTE · HOST TERMINAL</text>
  <text x="648" y="213" class="heading">TUI</text>
  <text x="648" y="247" class="code">run → TerminalClient.init → inbox.wait</text>
  <text x="648" y="277" class="code">events.update → dispatch</text>
  <text x="648" y="307" class="body">host_inputs → router → acción o pane input</text>
  <text x="648" y="341" class="small">Presenter: composición, pacing y escritura.</text>
  <text x="648" y="373" class="code">src/frontend/client/entrypoints/events.zig</text>

  <rect x="1205" y="145" width="550" height="255" rx="14" class="runtime"/>
  <text x="1228" y="177" class="label">RUNTIME · SOBREVIVE AL CLIENTE</text>
  <text x="1228" y="213" class="heading">Runtime</text>
  <text x="1228" y="247" class="code">Runtime.init / run → Runtime.update</text>
  <text x="1228" y="277" class="body">Socket → requests.dispatch → operations</text>
  <text x="1228" y="307" class="body">PTY / VT / workers → evento con dueño explícito</text>
  <text x="1228" y="341" class="small">Una autoridad para procesos, terminal e historia.</text>
  <text x="1228" y="373" class="code">src/backend/runtime/Runtime.zig</text>

  <path d="M315 400 V448" class="arrow"/>
  <path d="M895 400 V448" class="arrow"/>
  <path d="M1480 400 V448" class="arrow"/>

  <rect x="45" y="460" width="1120" height="257" rx="14" class="common"/>
  <text x="68" y="493" class="label">BIBLIOTECA COMÚN · UNA INSTANCIA POR CONEXIÓN</text>
  <text x="68" y="530" class="heading">AttachedClient + operaciones concretas</text>
  <text x="68" y="565" class="code">server_messages / actions → operations/{panes,tabs,workspaces,input,agents,...}</text>
  <text x="68" y="598" class="body">La operación reúne petición, confirmación y recuperación; llama a Model y a recursos reales.</text>
  <text x="68" y="631" class="body">Modelo: layout, foco, réplicas, selección, scroll y borradores. Transporte: correlación y outbox acotados.</text>
  <text x="68" y="664" class="body">Puertos de host: dibujo, gráficos, clipboard, entrada, sonido, notificaciones y servicios del sistema.</text>
  <text x="68" y="696" class="code">src/client/AttachedClient.zig · src/client/operations/ · src/client/model/</text>

  <rect x="1205" y="460" width="550" height="257" rx="14" class="runtime"/>
  <text x="1228" y="493" class="label">AUTORIDAD CANÓNICA</text>
  <text x="1228" y="530" class="heading">Operaciones del runtime</text>
  <text x="1228" y="565" class="body">Panes, tabs, workspaces, agentes e historia</text>
  <text x="1228" y="598" class="body">Validar → mutar → publicar respuesta o evento</text>
  <text x="1228" y="631" class="body">Un cliente cerrado no destruye sus PTYs.</text>
  <text x="1228" y="664" class="code">src/backend/runtime/application/</text>
  <text x="1228" y="696" class="code">requests.zig → operations/</text>

  <path d="M1174 588 H1198" class="arrow" marker-start="url(#arrow)"/>
  <text x="670" y="747" class="small">IPC: peticiones y respuestas con identidad; no es una sola pila síncrona entre procesos.</text>

  <rect x="45" y="776" width="1120" height="177" rx="14" class="panel"/>
  <text x="68" y="813" class="heading">Presentación y vida de recursos</text>
  <text x="68" y="849" class="body">Observar revisión → preparar → token en vuelo → completar → retirar sólo daño capturado.</text>
  <text x="68" y="882" class="body">El ACK confirma celdas aplicadas antes de la entrega al host. Un fallo conserva daño pendiente.</text>
  <text x="68" y="918" class="body">Generaciones, leases y cancelación con join impiden reutilizar bytes todavía prestados.</text>

  <rect x="1205" y="776" width="550" height="177" rx="14" class="panel"/>
  <text x="1228" y="813" class="heading">Headless</text>
  <text x="1228" y="849" class="body">Ejercita AttachedClient y sus operaciones.</text>
  <text x="1228" y="882" class="body">Controla demora, saturación, fallo y cancelación.</text>
  <text x="1228" y="918" class="code">src/client/presentation/headless_tests.zig</text>

  <rect x="45" y="988" width="540" height="96" rx="12" class="panel"/>
  <text x="68" y="1024" class="heading">Interactivo</text>
  <text x="68" y="1058" class="body">Input y celdas: trabajo acotado, sin esperar media.</text>
  <rect x="625" y="988" width="540" height="96" rx="12" class="panel"/>
  <text x="648" y="1024" class="heading">Media</text>
  <text x="648" y="1058" class="body">Cuotas, leases y reemplazo de trabajo obsoleto.</text>
  <rect x="1205" y="988" width="550" height="96" rx="12" class="panel"/>
  <text x="1228" y="1024" class="heading">Observación</text>
  <text x="1228" y="1058" class="body">Historia y agentes: workers fuera del input.</text>
  <text x="45" y="1129" class="small">Mapa y enlaces: docs/entrypoints.md · Propiedad y límites: docs/capabilities.md · Invariantes: docs/engineering-invariants.md</text>
</svg>
