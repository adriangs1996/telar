[package]
name = "telar-diagram-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer", default-features = false }
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
roxmltree = "=0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
